  <style>
    :root {
      --ink: #27231f;
      --cream: #fff8e8; 
      --shadow: #2d2925;
      --red: #ef4438;
      --orange: #f58b24;
      --yellow: #f5cf36;
      --lightgreen: #22c55e;
      --darkgreen: #15803d;
      --purple: #a855f7;
      --pink: #ec4899;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
      overscroll-behavior: none;
    }

    button { font: inherit; }

    .app-wrapper {
      position: relative;
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      overflow: hidden;
      background-color: var(--cream);
      background-image:
        radial-gradient(circle at 15% 14%, rgba(238, 68, 50, 0.12) 0 3px, transparent 4px),
        radial-gradient(circle at 83% 22%, rgba(255, 178, 26, 0.16) 0 4px, transparent 5px),
        linear-gradient(rgba(39, 35, 31, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(39, 35, 31, 0.035) 1px, transparent 1px);
      background-size: auto, auto, 32px 32px, 32px 32px;
    }

    .app-wrapper::before,
    .app-wrapper::after {
      content: "♪";
      position: fixed;
      z-index: 0;
      pointer-events: none;
      color: rgba(39, 35, 31, 0.08);
      font-size: clamp(5rem, 12vw, 10rem);
      font-weight: 800;
    }

    .app-wrapper::before {
      left: -1rem;
      bottom: 1rem;
      transform: rotate(-12deg);
    }

    .app-wrapper::after {
      content: "♫";
      right: -0.5rem;
      top: 4rem;
      transform: rotate(14deg);
    }

    .content-shell {
      position: relative;
      z-index: 1;
      width: min(100%, 1180px);
      margin: 0 auto;
      padding: clamp(1rem, 3vw, 2rem);
    }

    .topbar {
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .title-wrap {
      max-width: 700px;
    }

    .title-wrap [data-template-id="page-title"] {
      font-size: 2rem;
      font-weight: 800;
      font-family: "DM Sans", sans-serif;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      margin-bottom: 0.65rem;
      padding: 0.35rem 0.65rem;
      border: 2px solid rgba(39, 35, 31, 0.14);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.56);
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .sound-toggle {
      flex: 0 0 auto;
      min-width: 118px;
      min-height: 48px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      border: 3px solid var(--ink);
      border-radius: 16px;
      background: #fff;
      padding: 0.7rem 1rem;
      box-shadow: 4px 4px 0 var(--shadow);
      transition: transform 140ms ease, box-shadow 140ms ease;
      cursor: pointer;
    }

    .sound-toggle:hover {
      transform: translate(-1px, -1px);
      box-shadow: 6px 6px 0 var(--shadow);
    }

    .sound-toggle:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 var(--shadow);
    }

    .sound-toggle:focus-visible,
    .palette-note:focus-visible,
    .note-circle:focus-visible {
      outline: 4px solid #1677ff;
      outline-offset: 5px;
    }

    .sound-control {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.55rem;
      padding: 0.45rem 0.65rem;
      border: 3px solid var(--ink);
      border-radius: 16px;
      box-shadow: 4px 4px 0 var(--shadow);
      font-size: 0.75rem;
      font-weight: 700;
      background: #ffffff;
    }

    .sound-control-row {
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    .sound-control input[type="range"] {
      width: 100px;
      accent-color: #b91c1c;
      cursor: pointer;
    }

    .sound-control input[type="range"]:focus-visible,
    .sound-mute-toggle:focus-visible,
    .sound-help-toggle:focus-visible {
      outline: 3px solid #1677ff;
      outline-offset: 3px;
    }

    .sound-volume-value {
      min-width: 2.2em;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .sound-mute-toggle {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
    }

    .sound-help-toggle {
      padding: 0;
      border: 0;
      background: none;
      color: var(--ink);
      font: inherit;
      font-size: 0.68rem;
      font-weight: 500;
      opacity: 0.8;
      text-decoration: none;
      border-bottom: 1px dotted currentColor;
      white-space: nowrap;
      cursor: pointer;
    }

    .sound-help-toggle:hover {
      opacity: 1;
    }

    .sound-help-message {
      max-width: 290px;
      margin: 0;
      font-weight: 500;
      line-height: 1.4;
    }

    .toggle-state {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .toggle-state.hidden { display: none; }

    .workspace {
      display: grid;
      grid-template-columns: 1fr;
      align-items: stretch;
      gap: 1.25rem;
    }

    .selection-pane {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 1rem;
      padding: 1.25rem 1.5rem;
      border: 3px solid var(--ink);
      border-radius: 18px 34px 18px 34px;
      box-shadow: 8px 8px 0 rgba(39, 35, 31, 0.9);
    }

    .selection-pane-header-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .selection-pane-heading {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      margin-bottom: 0;
    }

    .selection-pane-copy {
      margin-bottom: 0;
      line-height: 1.4;
      max-width: 320px;
    }

    .octave-heading {

    .palette-note {
      position: relative;
      width: 82px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 4px solid var(--ink);
      border-radius: 50%;
      box-shadow:
        4px 5px 0 var(--shadow),
        inset 0 0 0 4px rgba(255, 255, 255, 0.24);
      color: var(--ink);
      cursor: grab;
      user-select: none;
      touch-action: none;
      transition: transform 150ms ease, box-shadow 150ms ease;
    }

    .palette-note::before,
    .note-circle::before {
      content: "";
      position: absolute;
      inset: 13%;
      border: 2px solid rgba(255, 255, 255, 0.38);
      border-radius: 50%;
      pointer-events: none;
    }

    .palette-note::after,
    .note-circle::after {
      content: "";
      position: absolute;
      width: 18%;
      height: 12%;
      left: 25%;
      top: 18%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.48);
      transform: rotate(-25deg);
      pointer-events: none;
    }

    .palette-note:hover {
      transform: translate(-1px, -1px) rotate(-2deg);
      box-shadow:
        6px 7px 0 var(--shadow),
        inset 0 0 0 4px rgba(255, 255, 255, 0.24);

    .palette-note.is-dragging {
      opacity: 0.35;
      cursor: grabbing;
    }

    .palette-label,
    .note-label {
      font-weight: 800;
      font-size: 1.4rem;
      font-family: "DM Sans", sans-serif;
      position: relative;
      z-index: 1;
      line-height: 1;
      letter-spacing: -0.07em;
      text-shadow: 2px 3px 0 rgba(255, 255, 255, 0.35);
      pointer-events: none;
      transform: scale(var(--label-scale, 1));
      transform-origin: center;
      transition: transform 140ms ease;
    }

    .palette-note .add-mark {
      position: absolute;
      right: -3px;
      bottom: 0px;
      z-index: 2;
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: #fffdf6;
      box-shadow: 1px 1px 0 var(--ink);

    .note-circle:hover {

        11px 12px 0 var(--shadow),

      animation: note-pop 360ms cubic-bezier(.2,.9,.3,1);
    }

    .note-circle.is-playing .note-label::after {
      content: "♪";
      position: absolute;
      right: -0.7em;
      top: -0.65em;

    }

      position: fixed;

      aspect-ratio: 1;
      display: grid;

    .trash-zone.is-visible {

    }

      border-color: var(--ink);
      color: #fff;
    }

    .helper-row {

    @keyframes note-pop {
      0% { scale: 1; }

      72% { scale: .97; }

    @keyframes music-rise {

  <script>
    const stage = document.getElementById("play-stage");
    const paletteNotes = Array.from(document.querySelectorAll(".palette-note"));
    const noteTemplate = document.getElementById("note-template");
    const trashZone = document.getElementById("trash-zone");
    const emptyState = document.getElementById("empty-state");
    const soundToggle = document.getElementById("sound-toggle");
    const soundHelpToggle = document.getElementById("sound-help-toggle");
    const soundHelpMessage = document.getElementById("sound-help-message");
    const soundVolumeInput = document.getElementById("sound-volume-input");
    const soundVolumeValue = document.getElementById("sound-volume-value");
    const moveToggle = document.getElementById("move-toggle");
    const moveOnState = document.getElementById("move-on-state");
    const moveOffState = document.getElementById("move-off-state");
    let movementEnabled = true;
    const statusElement = document.getElementById("status");

    // Metronome Variables
    const metroToggle = document.getElementById("metro-toggle");
    const metroPlayIcon = document.getElementById("metro-play-icon");
    const metroStopIcon = document.getElementById("metro-stop-icon");
    const metroBpmInput = document.getElementById("metro-bpm-input");
    const metroVisualBeat = document.getElementById("metro-visual-beat");
    const bellSizeInput = document.getElementById("bell-size-input");

    let audioContext = null;
    let muted = false;
    let soundVolume = Number(soundVolumeInput.value);
    let statusTimer = null;
    let nextId = 1;
    let activeCircleDrag = null;
    let activePaletteDrag = null;

    // Metronome State
    let isMetroPlaying = false;
    let metroNextNoteTime = 0.0;
    let metroTempo = 120.0;
    let metroLookahead = 25.0; // milliseconds
    let metroScheduleAheadTime = 0.1; // seconds
    let metroTimerId = null;

    const noteColours = {
      do3: "#ef4438",
      re3: "#f58b24",
      mi3: "#f5cf36",
      fa3: "#22c55e",
      sol3: "#15803d",
      la3: "#a855f7",
      si3: "#ec4899",
      dos3: "#f47d21",
      res3: "#f5ae2d",
      mis3: "#8bd34a",
      fas3: "#1ba840",
      sols3: "#5e6b9d",
      las3: "#c678c3",
      sis3: "#ec446e",
      do: "#ef4438",
      do5: "#ef4438",
      dos5: "#f47d21",
      re5: "#f58b24",
      mi5: "#f5cf36",
      fa5: "#22c55e",
      sol5: "#15803d",
      la5: "#a855f7",
      si5: "#ec4899",
      res5: "#f5ae2d",
      mis5: "#8bd34a",
      fas5: "#1ba840",
      sols5: "#5e6b9d",
      las5: "#c678c3",
      sis5: "#ec446e",
      re: "#f58b24",
      mi: "#f5cf36",
      fa: "#22c55e",
      sol: "#15803d",
      la: "#a855f7",
      si: "#ec4899",
      dos: "#f47d21",
      res: "#f5ae2d",
      mis: "#8bd34a",
      fas: "#1ba840",
      sols: "#5e6b9d",
      las: "#c678c3",
      sis: "#ec446e"
    };

    const templateTextDefaults = {
      "page-title": "Campanas ",
      "instructions": "Crea música añadiendo y moviendo campanas por el área de juego.",
      "move-on-button": "Mover Campanas",
      "move-off-button": "Campanas bloqueadas",
      "empty-title": "Escritorio",
      "empty-copy": "Elige una campana o arrástrala aquí para empezar.",
      "trash-label": "Suelta aquí para eliminar",
      "selection-title": "Elige tus campanas",
      "selection-help": "Pulsa una campana o arrástrala al escritorio.",
      "keyboard-hint": "En el escritorio: Enter o Espacio reproduce una campana; las flechas la mueven y Suprimir la elimina."
    };

    document.querySelectorAll("[data-template-id].canva-text").forEach((element) => {
      if (element.textContent.trim()) return;
      const templateId = element.dataset.templateId;
      const note = element.closest(".palette-note");
      if (note) {
        const type = note.dataset.noteType;
        const octave = type.endsWith("3") ? "₃" : type.endsWith("5") ? "₅" : "₄";
        element.textContent = note.dataset.noteName + octave;
      } else if (templateTextDefaults[templateId]) {
        element.textContent = templateTextDefaults[templateId];
      }
    });

    paletteNotes.forEach((palette) => {
      const colour = noteColours[palette.dataset.noteType];
      if (!colour) {
        throw new Error("No hay un color definido para la nota " + palette.dataset.noteType);
      }
      palette.style.backgroundColor = colour;
    });

    function ensureAudioContext() {
      if (audioContext && audioContext.state === "closed") {
        audioContext = null;
      }

      if (!audioContext) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return null;
        const context = new AudioContextClass();
        audioContext = context;
        context.addEventListener("statechange", () => {
          if (audioContext !== context) return;

          if (context.state === "running") {
            if (isMetroPlaying) restartMetronomeScheduler(context);
          } else {
            window.clearTimeout(metroTimerId);
            metroTimerId = null;
            if (context.state === "closed") audioContext = null;
          }
        });
      }
      return audioContext;
    }

    async function activateAudioContext() {
      try {
        const context = ensureAudioContext();
        if (!context) {
          showStatus("El audio no está disponible en este navegador");
          return null;
        }
        if (context.state !== "running") await context.resume();
        if (context.state !== "running") {
          showStatus("El navegador bloqueó el sonido. Revisa la configuración de audio del sitio y vuelve a intentarlo.");
          return null;
        }
        return context;
      } catch (error) {
        console.error("No se pudo activar el audio del navegador.", error);
        showStatus("No se pudo activar el sonido. Revisa la configuración de audio del sitio y vuelve a intentarlo.");
        return null;
      }
    }

    function showStatus(message) {
      statusElement.textContent = message;
      window.clearTimeout(statusTimer);
      statusTimer = window.setTimeout(() => {
        statusElement.textContent = "";
      }, 1500);
    }

    async function playFrequency(frequency, visualElement, noteName) {
      if (muted || soundVolume <= 0) {
        showStatus(muted ? "El sonido está silenciado" : "Sube el volumen para escuchar las campanas y el metrónomo");
        return;
      }

      const context = await activateAudioContext();
      if (!context) return;

      const now = context.currentTime;
      const masterGain = context.createGain();
      const oscillator = context.createOscillator();
      const warmth = context.createOscillator();
      const warmthGain = context.createGain();

      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(Number(frequency), now);
      warmth.type = "triangle";
      warmth.frequency.setValueAtTime(Number(frequency) * 2, now);
      warmthGain.gain.setValueAtTime(0.018, now);

      // Mantiene el tono audible sin saturar ni sonar excesivamente fuerte.
      masterGain.gain.setValueAtTime(0.0001, now);
      masterGain.gain.exponentialRampToValueAtTime(Math.max(0.0001, soundVolume), now + 0.018);
      masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.58);

      oscillator.connect(masterGain);
      warmth.connect(warmthGain);
      warmthGain.connect(masterGain);
      masterGain.connect(context.destination);

      oscillator.start(now);
      warmth.start(now);
      oscillator.stop(now + 0.62);
      warmth.stop(now + 0.62);

      if (visualElement.classList.contains("note-circle")) {
        visualElement.classList.remove("is-playing");
        void visualElement.offsetWidth;
        visualElement.classList.add("is-playing");
        window.setTimeout(() => visualElement.classList.remove("is-playing"), 390);
      }

      showStatus("Nota " + noteName + " reproducida");
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function updateEmptyState() {
      const hasCircles = Boolean(stage.querySelector(".note-circle"));
      emptyState.classList.toggle("is-hidden", hasCircles);
    }

    function setCirclePosition(circle, x, y) {
      const maxX = Math.max(0, stage.clientWidth - circle.offsetWidth);
      const maxY = Math.max(0, stage.clientHeight - circle.offsetHeight);
      const nextX = clamp(x, 0, maxX);
      const nextY = clamp(y, 0, maxY);

      circle.dataset.x = String(nextX);
      circle.dataset.y = String(nextY);
      circle.style.setProperty("--x", nextX + "px");
      circle.style.setProperty("--y", nextY + "px");
    }

    function isPointInStage(clientX, clientY) {
      const rect = stage.getBoundingClientRect();
      return clientX >= rect.left && clientX <= rect.right &&
        clientY >= rect.top && clientY <= rect.bottom;
    }

    function isCircleOverTrash(circle) {
      const circleRect = circle.getBoundingClientRect();
      const trashRect = trashZone.getBoundingClientRect();
      
      // Strict layout bounds check to determine if the circle element intersects with the trash element
      return !(circleRect.right < trashRect.left || 
               circleRect.left > trashRect.right || 
               circleRect.bottom < trashRect.top || 
               circleRect.top > trashRect.bottom);
    }

    function showTrash() {
      trashZone.classList.add("is-visible");
      trashZone.setAttribute("aria-hidden", "false");
    }

    function hideTrash() {
      trashZone.classList.remove("is-visible", "is-over");
      trashZone.setAttribute("aria-hidden", "true");
    }

    function createCircle(noteData, clientX, clientY) {
      const fragment = noteTemplate.content.cloneNode(true);
      const circle = fragment.querySelector(".note-circle");
      const label = fragment.querySelector(".note-label");
      const id = "circle-" + nextId++;

      circle.dataset.instanceId = id;
      circle.dataset.noteName = noteData.type === "do5" ? "DO₅" : noteData.name;
      circle.dataset.noteType = noteData.type;
      circle.dataset.frequency = String(noteData.frequency);
      circle.setAttribute("aria-label", "Reproducir " + (noteData.type === "do5" ? "DO₅" : noteData.name) + ". Arrastra para mover o eliminar.");
      const octave = noteData.type.endsWith("3") ? "₃" : noteData.type.endsWith("5") ? "₅" : "₄";
      label.textContent = noteData.name + octave;

      stage.appendChild(fragment);
      const addedCircle = stage.querySelector('[data-instance-id="' + id + '"]');
      addedCircle.style.background = noteColours[noteData.type];
      const bellSize = Number(bellSizeInput.value) || 120;
      addedCircle.style.setProperty("--bell-size", bellSize + "px");
      addedCircle.style.setProperty("--label-scale", String(clamp(bellSize / 120, 0.5, 2)));
      
      // Adapt text color dynamically for dark nodes
      if (noteData.type === 'sol' || noteData.type === 'la') {
        label.style.color = '#ffffff';
        label.style.textShadow = '2px 3px 0 rgba(0, 0, 0, 0.3)';
      }

      let x;
      let y;
      const stageRect = stage.getBoundingClientRect();

      if (typeof clientX === "number" && typeof clientY === "number") {
        x = clientX - stageRect.left - addedCircle.offsetWidth / 2;
        y = clientY - stageRect.top - addedCircle.offsetHeight / 2;
      } else {
        const count = stage.querySelectorAll(".note-circle").length;
        const offset = ((count - 1) % 5) * 18;
        x = stage.clientWidth / 2 - addedCircle.offsetWidth / 2 + offset - 36;
        y = stage.clientHeight / 2 - addedCircle.offsetHeight / 2 + offset - 36;
      }

      setCirclePosition(addedCircle, x, y);
      attachCircleInteractions(addedCircle);
      updateEmptyState();
      addedCircle.focus();
      return addedCircle;
    }

    function removeCircle(circle) {
      const name = circle.dataset.noteName;
      circle.remove();
      updateEmptyState();
      showStatus("Campana " + name + " eliminada");
    }

    function attachCircleInteractions(circle) {
      circle.addEventListener("pointerdown", (event) => {
        if (event.button !== undefined && event.button !== 0) return;
        if (!movementEnabled) {
          playFrequency(circle.dataset.frequency, circle, circle.dataset.noteName);
          event.preventDefault();
          return;
        }

        activeCircleDrag = {
          circle,
          pointerId: event.pointerId,
          startClientX: event.clientX,
          startClientY: event.clientY,
          originX: Number(circle.dataset.x || 0),
          originY: Number(circle.dataset.y || 0),
          moved: false
        };

        circle.setPointerCapture(event.pointerId);
        circle.classList.add("is-dragging");
        showTrash();
        event.preventDefault();
      });

      circle.addEventListener("pointermove", (event) => {
        const drag = activeCircleDrag;
        if (!drag || drag.circle !== circle || drag.pointerId !== event.pointerId) return;

        const deltaX = event.clientX - drag.startClientX;
        const deltaY = event.clientY - drag.startClientY;

        if (Math.hypot(deltaX, deltaY) > 6) drag.moved = true;
        setCirclePosition(circle, drag.originX + deltaX, drag.originY + deltaY);

        if (drag.moved) {
          trashZone.classList.toggle("is-over", isCircleOverTrash(circle));
        }
        event.preventDefault();
      });

      function finishCircleDrag(event, cancelled) {
        const drag = activeCircleDrag;
        if (!drag || drag.circle !== circle || drag.pointerId !== event.pointerId) return;

        const wasMoved = drag.moved;
        const shouldDelete = !cancelled && wasMoved && isCircleOverTrash(circle);
        activeCircleDrag = null;

        circle.classList.remove("is-dragging");
        if (circle.hasPointerCapture(event.pointerId)) {
          circle.releasePointerCapture(event.pointerId);
        }
        hideTrash();

        if (shouldDelete) {
          removeCircle(circle);
        } else if (!cancelled && !wasMoved) {
          playFrequency(circle.dataset.frequency, circle, circle.dataset.noteName);
        } else if (!cancelled) {
          showStatus("Círculo " + circle.dataset.noteName + " movido");
        }

        event.preventDefault();
      }

      circle.addEventListener("pointerup", (event) => finishCircleDrag(event, false));
      circle.addEventListener("pointercancel", (event) => finishCircleDrag(event, true));

      circle.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          playFrequency(circle.dataset.frequency, circle, circle.dataset.noteName);
          return;
        }

        if (event.key === "Delete" || event.key === "Backspace") {
          event.preventDefault();
          removeCircle(circle);
          return;
        }

        const movement = event.shiftKey ? 20 : 8;
        let nextX = Number(circle.dataset.x || 0);
        let nextY = Number(circle.dataset.y || 0);

        if (event.key === "ArrowLeft") nextX -= movement;
        else if (event.key === "ArrowRight") nextX += movement;
        else if (event.key === "ArrowUp") nextY -= movement;
        else if (event.key === "ArrowDown") nextY += movement;
        else return;

        event.preventDefault();
        setCirclePosition(circle, nextX, nextY);
        showStatus("Círculo " + circle.dataset.noteName + " movido");
      });
    }

    function createPaletteGhost(palette, clientX, clientY) {
      const ghost = document.createElement("div");
      ghost.className = "drag-ghost";
      ghost.style.background = noteColours[palette.dataset.noteType];
      ghost.textContent = palette.dataset.noteName;
      ghost.style.fontWeight = "800";
      ghost.style.fontSize = "2rem";
      ghost.style.left = clientX + "px";
      ghost.style.top = clientY + "px";
      ghost.setAttribute("aria-hidden", "true");
      document.body.appendChild(ghost);
      return ghost;
    }

    function addPaletteNote(palette, clientX, clientY) {
      const data = {
        name: palette.dataset.noteName,
        type: palette.dataset.noteType,
        frequency: Number(palette.dataset.frequency)
      };
      const circle = createCircle(data, clientX, clientY);
      playFrequency(data.frequency, circle, data.name);
      showStatus("Círculo " + data.name + " añadido");
    }

    paletteNotes.forEach((palette) => {
      palette.addEventListener("click", (event) => {
        if (event.detail !== 0) return;
        addPaletteNote(palette);
      });

      palette.addEventListener("pointerdown", (event) => {
        if (event.button !== undefined && event.button !== 0) return;

        activePaletteDrag = {
          palette,
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          moved: false,
          ghost: createPaletteGhost(palette, event.clientX, event.clientY)
        };

        palette.setPointerCapture(event.pointerId);
        palette.classList.add("is-dragging");
        event.preventDefault();
      });

      palette.addEventListener("pointermove", (event) => {
        const drag = activePaletteDrag;
        if (!drag || drag.palette !== palette || drag.pointerId !== event.pointerId) return;

        if (Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY) > 6) {
          drag.moved = true;
        }

        drag.ghost.style.left = event.clientX + "px";
        drag.ghost.style.top = event.clientY + "px";
        drag.ghost.style.opacity = isPointInStage(event.clientX, event.clientY) ? "1" : "0.72";
        event.preventDefault();
      });

      function finishPaletteDrag(event, cancelled) {
        const drag = activePaletteDrag;
        if (!drag || drag.palette !== palette || drag.pointerId !== event.pointerId) return;

        activePaletteDrag = null;
        palette.classList.remove("is-dragging");
        drag.ghost.remove();

        if (palette.hasPointerCapture(event.pointerId)) {
          palette.releasePointerCapture(event.pointerId);
        }

        if (!cancelled && drag.moved && isPointInStage(event.clientX, event.clientY)) {
          addPaletteNote(palette, event.clientX, event.clientY);
        } else if (!cancelled && !drag.moved) {
          addPaletteNote(palette);
        } else if (!cancelled && drag.moved) {
          showStatus("Suelta la campana dentro del área de juego");
        }

        event.preventDefault();
      }

      palette.addEventListener("pointerup", (event) => finishPaletteDrag(event, false));
      palette.addEventListener("pointercancel", (event) => finishPaletteDrag(event, true));
    });

    moveToggle.addEventListener("click", () => {
      movementEnabled = !movementEnabled;
      moveToggle.setAttribute("aria-pressed", String(movementEnabled));
      moveToggle.setAttribute("aria-label", movementEnabled ? "Bloquear movimiento de campanas" : "Activar movimiento de campanas");
      moveOnState.classList.toggle("hidden", !movementEnabled);
      moveOffState.classList.toggle("hidden", movementEnabled);
      showStatus(movementEnabled ? "Movimiento activado" : "Movimiento bloqueado");
    });

    soundToggle.addEventListener("click", async () => {
      muted = !muted;
      soundToggle.setAttribute("aria-pressed", String(muted));
      soundToggle.setAttribute("aria-label", muted ? "Activar sonidos" : "Silenciar sonidos");
      document.getElementById("sound-on-icon").classList.toggle("hidden", muted);
      document.getElementById("sound-off-icon").classList.toggle("hidden", !muted);

      if (muted) {
        showStatus("Sonido silenciado");
      } else {
        const context = await activateAudioContext();
        if (!context) return;
        showStatus("Sonido activado");
      }
    });

    soundVolumeInput.addEventListener("input", () => {
      soundVolume = Number(soundVolumeInput.value);
      soundVolumeValue.value = soundVolume.toFixed();
      soundVolumeValue.textContent = soundVolume.toFixed(1);
    });

    soundHelpToggle.addEventListener("click", () => {
      const isExpanded = soundHelpToggle.getAttribute("aria-expanded") === "true";
      soundHelpToggle.setAttribute("aria-expanded", String(!isExpanded));
      soundHelpMessage.hidden = isExpanded;
    });

    // Metronome Scheduling Logic
    function nextMetronomeBeat() {
      const secondsPerBeat = 60.0 / metroTempo;
      metroNextNoteTime += secondsPerBeat;
    }

    function scheduleMetronomeBeat(time) {
      if (muted || soundVolume <= 0) return;
      const context = ensureAudioContext();
      if (!context) return;

      const osc = context.createOscillator();
      const gainNode = context.createGain();

      osc.connect(gainNode);
      gainNode.connect(context.destination);

      // Metronome woodblock-like click sound
      osc.frequency.setValueAtTime(1000, time);
      gainNode.gain.setValueAtTime(0.001, time);
      gainNode.gain.exponentialRampToValueAtTime(Math.max(0.001, 0.1 * soundVolume / 1.5), time + 0.002);
      gainNode.gain.exponentialRampToValueAtTime(0.001, time + 0.05);

      osc.start(time);
      osc.stop(time + 0.06);

      // Schedule visual flash synchronized with audio context time
      const delayMs = Math.max(0, (time - context.currentTime) * 1000);
      setTimeout(() => {
        if (!isMetroPlaying) return;
        metroVisualBeat.classList.remove("bg-gray-200");
        metroVisualBeat.classList.add("bg-[#ef4438]");
        setTimeout(() => {
          metroVisualBeat.classList.remove("bg-[#ef4438]");
          metroVisualBeat.classList.add("bg-gray-200");
        }, 80);
      }, delayMs);
    }

    function metronomeScheduler() {
      metroTimerId = null;
      const context = audioContext;
      if (!isMetroPlaying || !context || context.state !== "running") return;
      while (metroNextNoteTime < context.currentTime + metroScheduleAheadTime) {
        scheduleMetronomeBeat(metroNextNoteTime);
        nextMetronomeBeat();
      }
      metroTimerId = setTimeout(metronomeScheduler, metroLookahead);
    }

    function restartMetronomeScheduler(context) {
      if (!isMetroPlaying || context.state !== "running") return;
      window.clearTimeout(metroTimerId);
      metroNextNoteTime = context.currentTime + 0.05;
      metronomeScheduler();
    }

    async function toggleMetronome() {
      if (!isMetroPlaying) {
        const context = await activateAudioContext();
        if (!context) return;
        isMetroPlaying = true;
        metroNextNoteTime = context.currentTime + 0.05;
        metroPlayIcon.classList.add("hidden");
        metroStopIcon.classList.remove("hidden");
        metroToggle.classList.replace("bg-[#ef4438]", "bg-[#27231f]");
        metroToggle.setAttribute("aria-label", "Detener metrónomo");
        showStatus("Metrónomo iniciado");
        metronomeScheduler();
      } else if (!audioContext || audioContext.state !== "running") {
        const context = await activateAudioContext();
        if (!context) return;
        restartMetronomeScheduler(context);
      } else {
        isMetroPlaying = false;
        clearTimeout(metroTimerId);
        metroTimerId = null;
        metroPlayIcon.classList.remove("hidden");
        metroStopIcon.classList.add("hidden");
        metroToggle.classList.replace("bg-[#27231f]", "bg-[#ef4438]");
        metroToggle.setAttribute("aria-label", "Iniciar metrónomo");
        metroVisualBeat.classList.remove("bg-[#ef4438]");
        metroVisualBeat.classList.add("bg-gray-200");
        showStatus("Metrónomo detenido");
      }
    }

    metroToggle.addEventListener("click", toggleMetronome);

    metroBpmInput.addEventListener("input", (e) => {
      let val = Number(e.target.value);
      if (isNaN(val)) return;
      // Clamp values dynamically on input to keep it stable but allow free typing
      metroTempo = clamp(val, 40, 240);
    });

    metroBpmInput.addEventListener("blur", (e) => {
      let val = Number(e.target.value);
      if (isNaN(val) || val < 40) {
        metroTempo = 40;
      } else if (val > 240) {
        metroTempo = 240;
      } else {
        metroTempo = val;
      }
      metroBpmInput.value = metroTempo;
    });

    function updateBellSize() {
      const size = clamp(Number(bellSizeInput.value) || 120, 60, 240);
      stage.querySelectorAll(".note-circle").forEach((circle) => {
        circle.style.setProperty("--bell-size", size + "px");
        circle.style.setProperty("--label-scale", String(clamp(size / 120, 0.5, 2)));
        setCirclePosition(circle, Number(circle.dataset.x || 0), Number(circle.dataset.y || 0));
      });
    }

    bellSizeInput.addEventListener("input", updateBellSize);

    window.addEventListener("resize", () => {
      stage.querySelectorAll(".note-circle").forEach((circle) => {
        setCirclePosition(
          circle,
          Number(circle.dataset.x || 0),
          Number(circle.dataset.y || 0)
        );
      });
    });

    window.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      updateEmptyState();
    });
  </script>
 </body>
